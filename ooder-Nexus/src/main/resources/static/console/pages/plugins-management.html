<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件管理 - Apex OS</title>
    <link rel="stylesheet" href="/console/css/remixicon/remixicon.css">
    <link rel="stylesheet" href="/console/css/nexus.css">
    <link rel="stylesheet" href="/console/css/components/stat-cards.css">
    <link rel="stylesheet" href="/console/css/pages/plugins-management.css">
</head>
<body>
    <div class="nx-page">
        <aside class="nx-page__sidebar">
            <div class="nx-p-4 nx-mb-4">
                <h1 class="nx-text-lg nx-font-bold" style="display: flex; align-items: center; gap: 8px;">
                    <i class="ri-server-line"></i> Apex OS
                </h1>
            </div>
            <ul class="nav-menu" id="nav-menu"></ul>
        </aside>
        
        <main class="nx-page__content">
            <header class="nx-page__header" style="border-bottom: none;">
                <div class="nx-flex nx-items-center nx-gap-3">
                    <button class="nx-btn nx-btn--ghost nx-btn--icon" data-nx-sidebar-toggle aria-label="切换侧边栏">
                        <i class="ri-menu-line"></i>
                    </button>
                    <div>
                        <h2 class="page-title">
                            <i class="ri-plug-line"></i>
                            插件管理
                        </h2>
                        <p class="page-subtitle">管理已安装的插件和扩展</p>
                    </div>
                </div>
                <div class="nx-flex nx-items-center nx-gap-3">
                    <button class="nx-btn nx-btn--ghost nx-btn--icon" data-nx-theme-toggle aria-label="切换主题">
                        <i class="ri-sun-line"></i>
                    </button>
                    <div class="nx-relative">
                        <div class="nx-page__user-menu" id="user-menu">
                            <div class="nx-page__user-avatar" id="user-avatar">U</div>
                            <span class="nx-page__user-name" id="user-name">加载中...</span>
                            <i class="ri-arrow-down-s-line"></i>
                        </div>
                        <div class="nx-page__dropdown-menu" id="user-dropdown">
                            <div class="nx-page__dropdown-item" onclick="window.location.href='my-profile.html'">
                                <i class="ri-user-line"></i> 个人中心
                            </div>
                            <div class="nx-page__dropdown-item" onclick="window.location.href='my-capabilities.html'">
                                <i class="ri-puzzle-line"></i> 我的技能
                            </div>
                            <div class="nx-page__dropdown-item nx-page__dropdown-item--danger" onclick="NX.userMenu.logout()">
                                <i class="ri-logout-box-line"></i> 退出登录
                            </div>
                        </div>
                    </div>
                    <button class="nx-btn nx-btn--secondary" onclick="PluginsManagement.checkUpdates()">
                        <i class="ri-refresh-line"></i> 检查更新
                    </button>
                    <button class="nx-btn nx-btn--primary" onclick="PluginsManagement.refresh()">
                        <i class="ri-restart-line"></i> 刷新
                    </button>
                </div>
            </header>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon installed"><i class="ri-install-line"></i></div>
                    <div class="stat-value" id="statInstalled">0</div>
                    <div class="stat-label">已安装</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon running"><i class="ri-play-circle-line"></i></div>
                    <div class="stat-value" id="statRunning">0</div>
                    <div class="stat-label">运行中</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stopped"><i class="ri-stop-circle-line"></i></div>
                    <div class="stat-value" id="statStopped">0</div>
                    <div class="stat-label">已停止</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon available"><i class="ri-store-2-line"></i></div>
                    <div class="stat-value" id="statAvailable">0</div>
                    <div class="stat-label">可用</div>
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="installed">已安装</button>
                    <button class="tab-btn" data-tab="market">插件市场</button>
                    <button class="tab-btn" data-tab="config">配置</button>
                </div>
                
                <div class="tab-content active" id="tab-installed">
                    <div class="plugin-list" id="installedList">
                        <div class="empty-state">
                            <i class="ri-inbox-line"></i>
                            <p>暂无已安装的插件</p>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-market">
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="search-box">
                                <i class="ri-search-line"></i>
                                <input type="text" placeholder="搜索插件..." id="marketSearch">
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <select id="categoryFilter" class="nx-select">
                                <option value="all">全部分类</option>
                                <option value="llm">大模型</option>
                                <option value="knowledge">知识库</option>
                                <option value="biz">业务</option>
                                <option value="util">工具</option>
                            </select>
                        </div>
                    </div>
                    <div class="plugin-list" id="marketList">
                    </div>
                </div>
                
                <div class="tab-content" id="tab-config">
                    <div class="config-form">
                        <div class="form-group">
                            <label>自动启动</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="autoStart" checked>
                                <span class="slider"></span>
                            </div>
                            <span class="form-hint">系统启动时自动加载已安装的插件</span>
                        </div>
                        <div class="form-group">
                            <label>热重载</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="hotReload" checked>
                                <span class="slider"></span>
                            </div>
                            <span class="form-hint">支持插件热更新，无需重启服务</span>
                        </div>
                        <div class="form-group">
                            <label>插件目录</label>
                            <input type="text" id="pluginDir" class="nx-input" value="./plugins">
                        </div>
                        <div class="form-group">
                            <label>更新源</label>
                            <select id="updateSource" class="nx-select">
                                <option value="gitee">Gitee</option>
                                <option value="github">GitHub</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                        <button class="nx-btn nx-btn--primary" onclick="PluginsManagement.saveConfig()">
                            <i class="ri-save-line"></i> 保存配置
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="overlay" id="overlay" onclick="closeDetailPanel()"></div>
    
    <div class="detail-panel" id="detailPanel">
        <div class="detail-panel-header">
            <h3>插件详情</h3>
            <button class="nx-btn nx-btn--ghost nx-btn--icon" onclick="closeDetailPanel()">
                <i class="ri-close-line"></i>
            </button>
        </div>
        <div class="detail-panel-content" id="detailPanelContent">
        </div>
    </div>
    
    <script src="/console/js/nexus.js"></script>
    <script src="/console/js/api-client.js"></script>
    <script src="/console/js/mock-data.js"></script>
    <script src="/console/js/menu.js"></script>
    <script src="/console/js/page-init.js" data-auto-init></script>
    <script src="/console/js/pages/plugins-management.js"></script>
</body>
</html>
