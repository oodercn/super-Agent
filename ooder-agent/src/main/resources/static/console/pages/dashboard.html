<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - ApexOS</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="nx-page">
        <div class="page-header">
            <h1><i class="ri-home-line"></i> 欢迎使用 ApexOS</h1>
            <p class="page-desc">开源智能操作系统 MVP 版本</p>
        </div>
        
        <div class="dashboard-cards">
            <div class="stat-card" onclick="location.href='/console/pages/capability-discovery.html'">
                <div class="stat-icon"><i class="ri-search-line"></i></div>
                <div class="stat-info">
                    <h3>能力发现</h3>
                    <p>发现和安装新技能</p>
                </div>
            </div>
            
            <div class="stat-card" onclick="location.href='/console/pages/plugins-management.html'">
                <div class="stat-icon"><i class="ri-plug-line"></i></div>
                <div class="stat-info">
                    <h3>插件管理</h3>
                    <p>管理已安装的技能</p>
                </div>
            </div>
            
            <div class="stat-card" onclick="location.href='/console/pages/workbench.html'">
                <div class="stat-icon"><i class="ri-chat-3-line"></i></div>
                <div class="stat-info">
                    <h3>LLM 对话</h3>
                    <p>智能助手对话</p>
                </div>
            </div>
            
            <div class="stat-card" onclick="location.href='/console/pages/llm-config.html'">
                <div class="stat-icon"><i class="ri-robot-line"></i></div>
                <div class="stat-info">
                    <h3>LLM 配置</h3>
                    <p>配置大模型服务</p>
                </div>
            </div>
        </div>
        
        <div class="quick-actions">
            <h2>快速开始</h2>
            <div class="action-list">
                <div class="action-item">
                    <i class="ri-book-open-line"></i>
                    <span>查看文档</span>
                </div>
                <div class="action-item">
                    <i class="ri-github-line"></i>
                    <span>访问源码</span>
                </div>
                <div class="action-item">
                    <i class="ri-question-line"></i>
                    <span>获取帮助</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
